[build]
  command = "npm run build"
  publish = "dist"

# Netlify Functions directory
[functions]
  directory = "netlify/functions"

# Proxy API routes to the Netlify Function (must be before SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
